<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>โครงสร้างโลก 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Tahoma",sans-serif;
  background:#050814;
  color:white;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#14254b 0%,#071022 42%,#02040b 100%);
}

/* ดาว */
.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#fff 1px,transparent 1.5px);
  background-size:97px 113px,151px 177px,233px 241px;
  background-position:20px 30px,70px 10px,130px 100px;
  opacity:.45;
}

/* หัว */
.header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:20;
  padding:16px 18px;
  background:linear-gradient(
    to bottom,
    rgba(2,5,15,.95),
    rgba(2,5,15,.55),
    transparent
  );
  text-align:center;
}

.header h1{
  font-size:25px;
  color:#fff;
  text-shadow:0 0 15px #42a5ff;
}

.header p{
  margin-top:5px;
  font-size:13px;
  color:#b7c9e8;
}

/* พื้นที่โลก */
#scene{
  position:absolute;
  left:50%;
  top:52%;
  width:620px;
  height:620px;
  transform:translate(-50%,-50%);
  touch-action:none;
  cursor:grab;
}

#scene.dragging{
  cursor:grabbing;
}

.world{
  position:absolute;
  left:50%;
  top:50%;
  width:430px;
  height:430px;
  transform-style:preserve-3d;
  transform:
    translate(-50%,-50%)
    rotateX(-15deg)
    rotateY(-25deg);
}

/* วงแหวนแต่ละชั้น */
.layer{
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%);
  transition:
    width .45s,
    height .45s,
    opacity .35s,
    filter .35s,
    box-shadow .35s;
  cursor:pointer;
}

.layer:hover{
  filter:brightness(1.25);
}

/* เปลือกโลก */
.crust{
  width:430px;
  height:430px;
  background:
    radial-gradient(
      circle at 35% 30%,
      #7fc8ff 0%,
      #2674c5 25%,
      #0d3c83 55%,
      #061d4b 100%
    );
  box-shadow:
    inset -35px -35px 70px rgba(0,0,0,.65),
    inset 20px 15px 35px rgba(255,255,255,.15),
    0 0 35px rgba(47,151,255,.35);
  z-index:4;
}

/* เส้นพื้นผิว */
.crust:before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  border:3px solid rgba(133,205,255,.6);
}

/* ทวีปจำลอง */
.continent{
  position:absolute;
  background:#55ad65;
  border-radius:45% 55% 35% 65%;
  opacity:.85;
  box-shadow:0 0 8px rgba(0,0,0,.25);
}

.c1{
  width:85px;
  height:55px;
  left:75px;
  top:85px;
  transform:rotate(-18deg);
}

.c2{
  width:70px;
  height:95px;
  right:80px;
  top:145px;
  transform:rotate(28deg);
}

.c3{
  width:90px;
  height:50px;
  left:150px;
  bottom:70px;
  transform:rotate(12deg);
}

.c4{
  width:48px;
  height:65px;
  left:65px;
  bottom:125px;
  transform:rotate(-30deg);
}

/* เนื้อโลก */
.mantle{
  width:350px;
  height:350px;
  background:
    radial-gradient(
      circle at 40% 35%,
      #ffdb75 0%,
      #ee8b2f 25%,
      #c74618 58%,
      #76130d 100%
    );
  box-shadow:
    inset -30px -30px 65px rgba(0,0,0,.65),
    inset 15px 15px 35px rgba(255,220,100,.18);
  z-index:3;
}

/* แก่นโลกชั้นนอก */
.outer{
  width:230px;
  height:230px;
  background:
    radial-gradient(
      circle at 38% 32%,
      #fff27b 0%,
      #ffbf27 25%,
      #e36b0b 60%,
      #9c2505 100%
    );
  box-shadow:
    inset -25px -25px 45px rgba(0,0,0,.5),
    0 0 30px rgba(255,135,0,.25);
  z-index:2;
}

/* แก่นโลกชั้นใน */
.inner{
  width:125px;
  height:125px;
  background:
    radial-gradient(
      circle at 35% 30%,
      #fffbc2 0%,
      #ffe85a 25%,
      #ff9e0b 70%,
      #d85200 100%
    );
  box-shadow:
    inset -18px -18px 30px rgba(0,0,0,.45),
    0 0 30px rgba(255,180,30,.4);
  z-index:1;
}

/* แสงรอบโลก */
.glow{
  position:absolute;
  width:470px;
  height:470px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  box-shadow:
    0 0 80px rgba(38,130,255,.25),
    0 0 150px rgba(38,130,255,.12);
  pointer-events:none;
}

/* ป้ายข้อมูล */
.info{
  position:absolute;
  z-index:30;
  left:18px;
  bottom:18px;
  width:300px;
  padding:18px;
  border-radius:18px;
  background:rgba(5,10,25,.88);
  border:1px solid rgba(90,170,255,.35);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}

.info h2{
  font-size:21px;
  margin-bottom:8px;
}

.info .depth{
  color:#73c4ff;
  font-size:13px;
  margin-bottom:9px;
}

.info p{
  font-size:14px;
  line-height:1.65;
  color:#d9e5f6;
}

/* ปุ่มชั้นโลก */
.menu{
  position:absolute;
  right:18px;
  top:105px;
  z-index:30;
  width:175px;
}

.menu-title{
  font-size:13px;
  color:#9db5d8;
  margin-bottom:8px;
  text-align:center;
}

.btn{
  width:100%;
  padding:10px 12px;
  margin-bottom:7px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  color:white;
  background:rgba(8,17,37,.82);
  cursor:pointer;
  text-align:left;
  transition:.2s;
}

.btn:hover,
.btn.active{
  background:rgba(36,105,185,.75);
  border-color:#69c4ff;
  transform:translateX(-3px);
}

.dot{
  display:inline-block;
  width:11px;
  height:11px;
  border-radius:50%;
  margin-right:7px;
}

/* คำแนะนำ */
.help{
  position:absolute;
  bottom:18px;
  right:18px;
  z-index:25;
  color:#8ea6ca;
  font-size:12px;
  text-align:right;
}

/* ปุ่มรีเซ็ต */
.reset{
  position:absolute;
  top:105px;
  left:18px;
  z-index:30;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,12,27,.8);
  color:#fff;
  border-radius:12px;
  padding:9px 13px;
  cursor:pointer;
}

/* ซ่อนชั้น */
.hidden{
  opacity:0 !important;
  pointer-events:none;
}

/* มือถือ */
@media(max-width:700px){

  .header h1{
    font-size:21px;
  }

  .header p{
    font-size:11px;
  }

  #scene{
    width:100vw;
    height:70vh;
    top:48%;
  }

  .world{
    width:310px;
    height:310px;
  }

  .crust{
    width:310px;
    height:310px;
  }

  .mantle{
    width:250px;
    height:250px;
  }

  .outer{
    width:165px;
    height:165px;
  }

  .inner{
    width:90px;
    height:90px;
  }

  .glow{
    width:340px;
    height:340px;
  }

  .menu{
    top:auto;
    right:10px;
    bottom:105px;
    width:145px;
  }

  .btn{
    padding:7px 9px;
    font-size:12px;
    margin-bottom:4px;
  }

  .info{
    left:10px;
    right:10px;
    bottom:10px;
    width:auto;
    padding:12px;
  }

  .info h2{
    font-size:17px;
  }

  .info p{
    font-size:12px;
    line-height:1.5;
  }

  .help{
    display:none;
  }

  .reset{
    top:92px;
    left:10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="stars"></div>

  <div class="header">
    <h1>🌍 โครงสร้างโลก 3 มิติ</h1>
    <p>หมุน • ซูม • แตะเลือกชั้นต่าง ๆ ของโลก</p>
  </div>

  <button class="reset" onclick="resetWorld()">↻ รีเซ็ต</button>

  <div id="scene">
    <div class="glow"></div>

    <div id="world" class="world">

      <div
        class="layer crust"
        id="crust"
        onclick="selectLayer('crust')">

        <div class="continent c1"></div>
        <div class="continent c2"></div>
        <div class="continent c3"></div>
        <div class="continent c4"></div>

      </div>

      <div
        class="layer mantle"
        id="mantle"
        onclick="selectLayer('mantle')">
      </div>

      <div
        class="layer outer"
        id="outer"
        onclick="selectLayer('outer')">
      </div>

      <div
        class="layer inner"
        id="inner"
        onclick="selectLayer('inner')">
      </div>

    </div>
  </div>

  <div class="menu">

    <div class="menu-title">
      เลือกชั้นของโลก
    </div>

    <button class="btn active" onclick="showOnly('crust')">
      <span class="dot" style="background:#2e8be8"></span>
      เปลือกโลก
    </button>

    <button class="btn" onclick="showOnly('mantle')">
      <span class="dot" style="background:#e85d24"></span>
      เนื้อโลก
    </button>

    <button class="btn" onclick="showOnly('outer')">
      <span class="dot" style="background:#f38b13"></span>
      แก่นโลกชั้นนอก
    </button>

    <button class="btn" onclick="showOnly('inner')">
      <span class="dot" style="background:#ffd52e"></span>
      แก่นโลกชั้นใน
    </button>

    <button class="btn" onclick="showAll()">
      <span class="dot" style="background:white"></span>
      แสดงทั้งหมด
    </button>

  </div>

  <div class="info" id="info">
    <h2>🌎 โครงสร้างโลก</h2>
    <div class="depth">โลกประกอบด้วยชั้นสำคัญ 4 ชั้น</div>
    <p>
      แตะปุ่มด้านขวาเพื่อดูรายละเอียดของแต่ละชั้น
      หรือลากบนโลกเพื่อหมุนดูโมเดล 3 มิติ
    </p>
  </div>

  <div class="help">
    👆 ลากเพื่อหมุนโลก<br>
    🤏 ใช้สองนิ้วเพื่อซูมบนมือถือ
  </div>

</div>

<script>

const scene = document.getElementById("scene");
const world = document.getElementById("world");

let rotX = -15;
let rotY = -25;
let scale = 1;

let dragging = false;
let lastX = 0;
let lastY = 0;

function updateWorld(){

  world.style.transform =
    "translate(-50%,-50%) " +
    "rotateX("+rotX+"deg) " +
    "rotateY("+rotY+"deg) " +
    "scale("+scale+")";

}

/* เมาส์ */
scene.addEventListener("mousedown",function(e){

  dragging=true;

  lastX=e.clientX;
  lastY=e.clientY;

  scene.classList.add("dragging");

});

window.addEventListener("mouseup",function(){

  dragging=false;

  scene.classList.remove("dragging");

});

window.addEventListener("mousemove",function(e){

  if(!dragging) return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  rotY += dx*.45;
  rotX -= dy*.45;

  rotX=Math.max(-85,Math.min(85,rotX));

  lastX=e.clientX;
  lastY=e.clientY;

  updateWorld();

});

/* สัมผัสมือถือ */
scene.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length===1){

      dragging=true;

      lastX=e.touches[0].clientX;
      lastY=e.touches[0].clientY;

    }

  },
  {passive:false}
);

scene.addEventListener(
  "touchmove",
  function(e){

    if(e.touches.length===1 && dragging){

      e.preventDefault();

      const x=e.touches[0].clientX;
      const y=e.touches[0].clientY;

      const dx=x-lastX;
      const dy=y-lastY;

      rotY += dx*.45;
      rotX -= dy*.45;

      rotX=Math.max(-85,Math.min(85,rotX));

      lastX=x;
      lastY=y;

      updateWorld();

    }

  },
  {passive:false}
);

scene.addEventListener(
  "touchend",
  function(){

    dragging=false;

  }
);

/* ซูมด้วยเมาส์ */
scene.addEventListener(
  "wheel",
  function(e){

    e.preventDefault();

    scale += e.deltaY < 0 ? .08 : -.08;

    scale=Math.max(.65,Math.min(1.8,scale));

    updateWorld();

  },
  {passive:false}
);

/* ข้อมูลแต่ละชั้น */
const data={

  crust:{
    title:"🌍 เปลือกโลก",
    depth:"ความหนาประมาณ 5–70 กิโลเมตร",
    text:
    "เป็นชั้นนอกสุดของโลก ประกอบด้วยหินแข็ง " +
    "แบ่งเป็นเปลือกโลกมหาสมุทรและเปลือกโลกทวีป " +
    "เป็นบริเวณที่มนุษย์อาศัยอยู่"
  },

  mantle:{
    title:"🔥 เนื้อโลก",
    depth:"ลึกประมาณ 35–2,900 กิโลเมตร",
    text:
    "อยู่ถัดจากเปลือกโลกลงไป มีอุณหภูมิและความดันสูง " +
    "ประกอบด้วยหินซิลิเกตเป็นหลัก และมีการเคลื่อนที่ของ " +
    "มวลสารอย่างช้า ๆ ซึ่งเกี่ยวข้องกับการเคลื่อนที่ของแผ่นธรณีภาค"
  },

  outer:{
    title:"🟠 แก่นโลกชั้นนอก",
    depth:"ลึกประมาณ 2,900–5,150 กิโลเมตร",
    text:
    "เป็นชั้นของโลหะที่อยู่ในสถานะของเหลว ประกอบด้วย " +
    "เหล็กและนิกเกิลเป็นส่วนใหญ่ การไหลเวียนของโลหะเหลว " +
    "เกี่ยวข้องกับการเกิดสนามแม่เหล็กโลก"
  },

  inner:{
    title:"🟡 แก่นโลกชั้นใน",
    depth:"ลึกประมาณ 5,150–6,371 กิโลเมตร",
    text:
    "เป็นส่วนที่อยู่ใจกลางโลก ประกอบด้วยเหล็กและนิกเกิลเป็นหลัก " +
    "แม้อุณหภูมิสูงมาก แต่ความดันมหาศาลทำให้บริเวณนี้อยู่ในสถานะของแข็ง"
  }

};

function selectLayer(id){

  const d=data[id];

  document.getElementById("info").innerHTML=
    "<h2>"+d.title+"</h2>"+
    "<div class='depth'>"+d.depth+"</div>"+
    "<p>"+d.text+"</p>";

}

function showOnly(id){

  const ids=["crust","mantle","outer","inner"];

  ids.forEach(function(x){

    const el=document.getElementById(x);

    if(x===id){

      el.classList.remove("hidden");

      el.style.opacity="1";

    }else{

      el.classList.add("hidden");

    }

  });

  selectLayer(id);

  updateButtons(id);

}

function showAll(){

  ["crust","mantle","outer","inner"].forEach(function(id){

    document.getElementById(id).classList.remove("hidden");

  });

  document.getElementById("info").innerHTML=
    "<h2>🌎 โครงสร้างโลก</h2>"+
    "<div class='depth'>โลกประกอบด้วยชั้นสำคัญ 4 ชั้น</div>"+
    "<p>เปลือกโลก เนื้อโลก แก่นโลกชั้นนอก และแก่นโลกชั้นใน</p>";

  document.querySelectorAll(".btn").forEach(function(b){

    b.classList.remove("active");

  });

}

function updateButtons(id){

  document.querySelectorAll(".btn").forEach(function(b){

    b.classList.remove("active");

  });

  const buttons=document.querySelectorAll(".btn");

  if(id==="crust") buttons[0].classList.add("active");
  if(id==="mantle") buttons[1].classList.add("active");
  if(id==="outer") buttons[2].classList.add("active");
  if(id==="inner") buttons[3].classList.add("active");

}

function resetWorld(){

  rotX=-15;
  rotY=-25;
  scale=1;

  updateWorld();

  showAll();

}

updateWorld();

</script>

</body>
</html>
